# Nginx config — reverse proxy to Daphne (ASGI) with WebSocket support
# Works as-is on Windows (C:\nginx\conf\nginx.conf) and Linux.
#
# Steps:
#   1. Backup your existing nginx.conf, then replace with this file.
#   2. Adjust paths if your project is elsewhere.
#   3. nginx -t
#   4. nginx -s reload
#
# Optional — for nginx to serve static/media directly (faster):
#   Add to settings.py: STATIC_ROOT = BASE_DIR / "staticfiles"
#   Then run:  python manage.py collectstatic --noinput

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # --- Daphne back-end ---
    upstream daphne {
        server 127.0.0.1:5000;
    }

    server {
        listen       80;
        server_name  localhost 127.0.0.1;

        client_max_body_size 20M;

        # --- Uncomment when you have STATIC_ROOT set ---
        # location /static/ {
        #     alias C:/Users/maday/PROJECTS/CAPSTONE_PROJECT/staticfiles/;
        #     expires 30d;
        #     access_log off;
        # }

        # --- Media uploads ---
        # location /media/ {
        #     alias C:/Users/maday/PROJECTS/CAPSTONE_PROJECT/media/;
        #     expires 30d;
        # }

        # --- WebSocket (django_channels + django_browser_reload) ---
        location ~ /(ws/|__reload__/) {
            proxy_pass http://daphne;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
        }

        # --- Everything else ---
        location / {
            proxy_pass http://daphne;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;
        }
    }
}
