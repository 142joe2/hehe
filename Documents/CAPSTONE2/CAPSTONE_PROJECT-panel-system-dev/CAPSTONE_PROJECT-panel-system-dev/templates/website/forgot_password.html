<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAUFA | Forgot Password</title>
    <link rel="icon" type="image/png" href="{% static 'img/isu_caufa_official.png' %}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
  </head>
  <body>
    <a href="{% url 'login' %}" class="sticky-back-home">
      <i class="fa-solid fa-arrow-left"></i> Back to Login
    </a>
    <section class="login-shell">
      <div class="brand">
        <img src="{% static 'img/isu_caufa_official.png' %}" alt="CAUFA logo" />
        <div>
          <strong>CAUFA</strong>
          <span>Forgot Password</span>
        </div>
      </div>

      <form method="post" novalidate id="forgotForm">
        {% csrf_token %}

        {% if messages %}
          {% for message in messages %}
            <p class="error-note" style="color: #d32f2f; margin-bottom: 15px; font-size: 14px; font-weight: 500;">
              <i class="fa-solid fa-circle-exclamation"></i> {{ message }}
            </p>
          {% endfor %}
        {% endif %}

        <div id="forgotError" class="login-status-card login-status-error" style="display: none;" role="alert"></div>

        <p style="font-size: 14px; color: #555; margin-bottom: 20px; line-height: 1.6;">
          Enter your registered email address below and we'll send you a one-time verification code to reset your password.
        </p>

        <div>
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <i class="fa-regular fa-envelope field-icon" aria-hidden="true"></i>
            <input id="email" name="email" type="email" placeholder="Enter your registered email" required autofocus />
          </div>
        </div>

        <button class="submit-btn" type="submit" id="sendBtn">
          <i class="fa-solid fa-paper-plane"></i> Send Verification Code
        </button>
      </form>
    </section>

    <script>
      (function () {
        var form = document.getElementById('forgotForm');
        var sendBtn = document.getElementById('sendBtn');
        var errorBox = document.getElementById('forgotError');

        form.addEventListener('submit', function (e) {
          errorBox.style.display = 'none';
          sendBtn.disabled = true;
          sendBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...';
        });
      })();
    </script>
  </body>
</html>
